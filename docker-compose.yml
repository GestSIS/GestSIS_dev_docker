services:
  doc:
    build:
      context: ./GestSIS_Doc
      dockerfile: Dockerfile
    image: retype:1.0
    container_name: gestsis-doc
    restart: unless-stopped
    tty: true
    working_dir: /app
    ports:
      - 8081:8081
    volumes:
      - ./GestSIS_Doc:/app
      - /app/node_modules
      - pnpm-cache:/pnpm-store
    networks:
      - gestsis
    command: sh -c "pnpm install --store-dir /pnpm-store && pnpm docs:dev --port 8081 --host 0.0.0.0"

  app:
    build:
      context: ./GestSIS_APP
      dockerfile: Dockerfile
    image: vue-dev:2.3
    container_name: gestsis-app
    restart: unless-stopped
    tty: true
    working_dir: /app
    ports:
      - 8080:8080
    volumes:
      - ./GestSIS_APP:/app
      - /app/node_modules
      - pnpm-cache:/pnpm-store
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - gestsis
    command: sh -c "pnpm install --store-dir /pnpm-store && pnpm dev --host --port=8080"

  api:
    build:
      context: ./GestSIS_API
      dockerfile: Dockerfile
    image: laravel-api:2.5
    container_name: gestsis-api
    restart: unless-stopped
    tty: true
    working_dir: /app
    ports:
      - 8000:8000
      - 5000:5000
    volumes:
      - ./GestSIS_API:/app
    networks:
      - gestsis
    depends_on:
      - db
      - valkey
    command: bash -c "composer install && php artisan dbs:init && php artisan serve --host=0.0.0.0 --port=8000"

  auth:
    build:
      context: ./GestSIS_Auth
      dockerfile: Dockerfile
    image: laravel-auth:2.3
    container_name: gestsis-auth
    restart: unless-stopped
    tty: true
    working_dir: /app
    environment:
      PHP_MEMORY_LIMIT: 2048M
    ports:
      - 8001:8001
    volumes:
      - ./GestSIS_Auth:/app
    networks:
      - gestsis
    depends_on:
      - db
      - valkey
    command: bash -c "composer install && php artisan migrate:fresh --seed && php artisan serve --host=0.0.0.0 --port=8001"

  alarm:
    build:
      context: ./GestSIS_Alarm
      dockerfile: Dockerfile
    image: python-dev:1.3
    container_name: gestsis-alarm
    restart: unless-stopped
    tty: true
    working_dir: /app
    ports:
      - 8002:8002
    volumes:
      - ./GestSIS_Alarm:/app
    networks:
      - gestsis
    command: >
      sh -c "uv sync --locked && uv run _scripts/init.py -f && uv run manage.py migrate && uv run manage.py loaddata sis && uv run manage.py runserver 0.0.0.0:8002"

  db:
    image: mysql:8.4
    container_name: gestsis-db
    restart: unless-stopped
    tty: true
    # Dev/test only: durability traded for speed (no fsync per commit, no binlog, no doublewrite, single shared tablespace)
    command: >
      --innodb-flush-log-at-trx-commit=0
      --skip-log-bin
      --innodb-doublewrite=OFF
      --innodb-file-per-table=OFF
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      MYSQL_DATABASE: gestsis
      MYSQL_ROOT_PASSWORD: pwd # Dev only — change in production
      MYSQL_PASSWORD: pwd # Dev only — change in production
      MYSQL_USER: gestsis
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    # Dev/test only: data lives in RAM, wiped on every container restart
    tmpfs:
      - /var/lib/mysql:size=2g
    volumes:
      - ./docker-compose/mysql:/docker-entrypoint-initdb.d
    networks:
      - gestsis

  valkey:
    image: valkey/valkey:9-alpine
    container_name: gestsis-valkey
    restart: unless-stopped
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gestsis

networks:
  gestsis:
    name: gestsis
    driver: bridge

volumes:
  pnpm-cache:
